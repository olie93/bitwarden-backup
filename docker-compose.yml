
services:

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: bitwarden-backup-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - bitwardenredis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - BitWarden-Net


  # ==========================================
  # BITWARDEN BACKUP API
  # ==========================================
  api:
    image: ghcr.io/olie93/bitwarden-backup-api:latest
    container_name: bitwarden-backup-api
    restart: unless-stopped

    environment:
      # Application
      PYTHONPATH: /app
      REDIS_URL: redis://redis.:6379/0

      # Bitwarden authentication
      BW_CLIENTID: ${BW_CLIENTID}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET}
      BW_PASSWORD: ${BW_PASSWORD}

      # Backup encryption
      ENCRYPTION_PASSWORD: ${ENCRYPTION_PASSWORD}

      # Remote backup storage
      RCLONE_CONFIG_BASE64: ${RCLONE_CONFIG_BASE64}

      # API authentication
      API_TOKEN: ${API_TOKEN}

      # Reverse proxy configuration
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}

      # Backup configuration
      BACKUP_PATH: ${BACKUP_PATH:-bitwarden-backup}
      EXPORT_ORGANIZATIONS: ${EXPORT_ORGANIZATIONS:-false}

      # Security
      API_ALLOW_BACKUP_DECRYPTION: "false"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5050/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - BitWarden-Net

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5050"


  # ==========================================
  # BITWARDEN BACKUP WEB INTERFACE
  # ==========================================
  ui:
    image: ghcr.io/olie93/bitwarden-backup-ui:latest
    container_name: bitwarden-backup-ui
    restart: unless-stopped

    ports:
      - "192.168.20.10:3000:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - BitWarden-Net
  # ==========================================
  # VAULTSYNC BACKUP SCHEDULER
  # ==========================================
  scheduler:
    image: alpine:3.21
    container_name: bitwarden-backup-scheduler
    restart: unless-stopped

    environment:
      TZ: Europe/London
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}

    depends_on:
      api:
        condition: service_healthy

    networks:
      - BitWarden-Net

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        # Install curl and timezone data
        apk add --no-cache curl tzdata

        # Create backup trigger script
        cat > /usr/local/bin/trigger-backup <<'EOF'
        #!/bin/sh
        set -eu

        echo "[$(date -Is)] Triggering VaultSync backup"

        curl --fail-with-body \
          --silent \
          --show-error \
          --connect-timeout 10 \
          --max-time 60 \
          -X POST \
          -H "Authorization: Bearer $${API_TOKEN}" \
          http://api:5050/api/v1/jobs/trigger

        echo
        echo "[$(date -Is)] Backup job submitted"
        EOF

        chmod 700 /usr/local/bin/trigger-backup

        # Schedule daily backup at 03:00
        echo '0 3 * * * /usr/local/bin/trigger-backup >> /proc/1/fd/1 2>&1' \
          > /etc/crontabs/root

        echo "VaultSync scheduler running - daily at 03:00"

        # Start cron in foreground
        exec crond -f -l 8

# ==========================================
# NETWORKS
# ==========================================
networks:
  BitWarden-Net:
    driver: bridge
    name: BitWarden-Net

# ==========================================
# PERSISTENT STORAGE
# ==========================================
volumes:

  bitwardenredis_data:
    driver: local
