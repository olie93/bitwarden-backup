
name: Build and Publish VaultSync Images

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "ui/**"
      - "scripts/**"
      - "Dockerfile.api"
      - "Dockerfile.frontend"
      - "nginx.conf"
      - "pyproject.toml"
      - "run-api.sh"
      - "setup-rclone.sh"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
            image: bitwarden-backup-api

          - service: ui
            dockerfile: Dockerfile.frontend
            image: bitwarden-backup-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/olie93/${{ matrix.image }}:latest
            ghcr.io/olie93/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/olie93/bitwarden-backup
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
